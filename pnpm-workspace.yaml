allowBuilds:
  esbuild: true
# Svedit releases are intentional application dependencies even while they are
# inside pnpm's minimum release age window.
minimumReleaseAgeExclude:
  - svedit
  - '@sveltejs/adapter-static@4.0.0-next.4'
  - '@sveltejs/kit@3.0.0-next.16'
  - '@sveltejs/adapter-node@6.0.0-next.8'
